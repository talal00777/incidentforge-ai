name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Backend, frontend and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incidentforge
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: incidentforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentforge -d incidentforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-strong-secret-for-incidentforge-000000000
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://incidentforge:ci-test-only@127.0.0.1:5432/incidentforge
      REDIS_URL: redis://127.0.0.1:6379/0
      INTERNAL_API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: python -m pip install -e './apps/api[dev]'
      - name: Lint and format backend
        working-directory: apps/api
        run: |
          ruff check .
          ruff format --check .
      - name: Check Django and migrations
        working-directory: apps/api
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
      - name: Backend tests
        working-directory: apps/api
        run: pytest --cov=core --cov-report=term-missing
      - name: Contract policy unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Install frontend
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Lint and test frontend
        working-directory: apps/web
        run: |
          npm run lint
          npm test
      - name: Generate and validate API contracts
        run: bash scripts/verify-contract.sh
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
      - name: Check patch integrity
        run: git diff --check

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Load development environment
        run: cp .env.example .env
      - name: Validate database hostname
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse

          entries = dict(
              line.split("=", 1)
              for line in Path(".env").read_text().splitlines()
              if line and not line.startswith("#") and "=" in line
          )

          hostname = urlparse(entries["DATABASE_URL"]).hostname

          if hostname != "postgres":
              raise SystemExit(
                  f"Invalid database hostname: {hostname!r}; expected 'postgres'"
              )
          PY
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start foundation services
        run: |
          if docker compose up --build -d --wait --wait-timeout 240; then
            docker compose ps
          else
            echo "=== Container status ==="
            docker compose ps -a

            echo "=== Django API logs ==="
            docker compose logs --no-color --tail=200 api

            echo "=== PostgreSQL logs ==="
            docker compose logs --no-color --tail=80 postgres

            echo "=== API health-check details ==="
            API_ID=$(docker compose ps -q api)
            if [ -n "$API_ID" ]; then
              docker inspect --format '{{json .State.Health}}' "$API_ID"
            fi

            exit 1
          fi
      - name: Assert services and HTTP endpoints
        run: |
          curl --fail --show-error --retry 8 --retry-delay 3 \
            http://127.0.0.1:8000/health/ready

          curl --fail --show-error \
            http://127.0.0.1:8000/api/v1/system

          curl --fail --show-error --retry 8 --retry-delay 3 \
            http://127.0.0.1:3000/ > /dev/null

          running_services="$(docker compose ps --services --status running)"

          for service in postgres redis api web worker beat; do
            if ! grep -Fxq "$service" <<< "$running_services"; then
              echo "::error::Required service '$service' is not running"
              docker compose ps -a
              exit 1
            fi
          done

          init_container="$(docker compose ps -a -q evidence-init)"

          if [ -z "$init_container" ]; then
            echo "::error::Evidence initialization container is missing"
            exit 1
          fi

          init_exit_code="$(docker inspect \
            --format '{{.State.ExitCode}}' "$init_container")"

          if [ "$init_exit_code" -ne 0 ]; then
            echo "::error::Evidence initialization failed"
            exit 1
          fi
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Container status ==="
          docker compose ps -a

          echo "=== API health-check details ==="
          API_ID="$(docker compose ps -q api)"
          if [ -n "$API_ID" ]; then
            docker inspect "$API_ID" \
              --format '{{json .State.Health}}' || true
          fi

          echo "=== API logs ==="
          docker compose logs --no-color --tail=150 api || true

          echo "=== Database and broker logs ==="
          docker compose logs --no-color --tail=60 postgres redis || true
