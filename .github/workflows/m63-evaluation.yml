name: M6.3 Offline Evaluation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DJANGO_SECRET_KEY: ci-only-long-random-looking-synthetic-key-000000000
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://incidentforge:ci-only@127.0.0.1:5432/incidentforge
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend development dependencies
        run: python -m pip install -e './apps/api[dev]'
      - name: Lint and format M6.3 files
        working-directory: apps/api
        run: |
          ruff check investigations/evals investigations/tests/test_m63_evaluation.py
          ruff format --check investigations/evals investigations/tests/test_m63_evaluation.py
      - name: Evaluate pinned offline cases using production validator
        working-directory: apps/api
        run: |
          python -m pytest -q investigations/tests/test_m63_evaluation.py \
            --cov=investigations.evals --cov-report=term-missing
          python -m investigations.evals.cli \
            --mode offline --output "$RUNNER_TEMP/incidentforge-m63-offline"
      - name: Archive synthetic-only validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m63-offline-validator-results
          path: ${{ runner.temp }}/incidentforge-m63-offline/
          retention-days: 14
